name: Source health

# 真实源站巡检与代码门禁分离（ADR-0014）：PR/push 的 CI 只跑确定性夹具，
# 外部站点的可用性与适配器漂移在这里每天检查一次，失败不阻塞代码合并。
on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # refresh-cli 任一站失败即退出码 1，并打印各站条数与失败原因
      - run: npm run refresh
